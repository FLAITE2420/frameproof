<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>entrance</title>
<style>
  html,body{margin:0;background:#0b0b0c;color:#fff;font:16px/1.4 ui-sans-serif,system-ui,sans-serif}
  .box{width:240px;height:120px;margin:80px auto;border-radius:12px;background:#2b2b31}
  /* short, fill: none: on a slow load this is gone before any tool can look at it */
  .box{opacity:0;transform:translateY(40px);animation:in 120ms ease-out}
  @keyframes in{to{opacity:1;transform:translateY(0)}}
</style></head>
<body><div class="box" id="box"></div></body></html>
