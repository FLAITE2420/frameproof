<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>edge: same motion, different skin</title>
<style>
  html,body{margin:0;background:#0b1020;color:#e2e8f0;font:16px/1.4 ui-sans-serif,system-ui,sans-serif}
  .stage{height:100vh;display:grid;place-items:center}
  .cards{display:flex;gap:24px}
  .card{width:220px;height:260px;border-radius:6px;background:#1e293b;border:2px solid #38bdf8;
        opacity:0;transform:translateY(64px) scale(.92);
        animation:rise 720ms cubic-bezier(.16,1,.3,1) forwards}
  .card:nth-child(1){animation-delay:80ms}
  .card:nth-child(2){animation-delay:200ms}
  .card:nth-child(3){animation-delay:320ms}
  .title{position:absolute;top:64px;left:50%;translate:-50% 0;font-size:34px;font-weight:700;
         opacity:0;animation:fade 500ms ease-out 600ms forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes fade{to{opacity:1}}
</style></head>
<body>
  <div class="stage">
    <h1 class="title">yours</h1>
    <div class="cards">
      <div class="card"></div><div class="card"></div><div class="card"></div>
    </div>
  </div>
</body></html>
