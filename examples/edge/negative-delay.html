<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>edge: negative delay</title>
<style>
  html,body{margin:0;background:#111;color:#fff;font:16px ui-sans-serif,system-ui}
  .box{position:absolute;left:60px;top:60px;width:200px;height:120px;background:#3b82f6;border-radius:12px;
       /* starts 200ms into a 400ms animation */
       animation: drop 400ms ease-out -200ms both}
  @keyframes drop{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:translateY(0)}}
</style></head><body><div class="box" id="box"></div></body></html>
