<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>edge: hover transition</title>
<style>
  html,body{margin:0;background:#f4f4f5;color:#111;font:16px ui-sans-serif,system-ui}
  .stage{height:100vh;display:grid;place-items:center}
  .btn{width:240px;height:120px;border-radius:16px;background:#fff;border:1px solid #e4e4e7;
       transform:translateY(0) scale(1);transition:transform 250ms cubic-bezier(.2,.8,.2,1),box-shadow 250ms;box-shadow:0 1px 2px #0001}
  .btn:hover{transform:translateY(-8px) scale(1.04);box-shadow:0 16px 40px #0002}
</style></head><body><div class="stage"><div class="btn" id="btn"></div></div></body></html>
