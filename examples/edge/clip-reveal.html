<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>edge: clip reveal</title>
<style>
  html,body{margin:0;background:#000;color:#fff;font:16px ui-sans-serif,system-ui}
  .pic{position:absolute;left:40px;top:60px;width:320px;height:180px;border-radius:10px;
       background:linear-gradient(90deg,#f43f5e,#f59e0b,#22d3ee);
       animation:wipe 600ms cubic-bezier(.65,0,.35,1) both}
  @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
</style></head><body><div class="pic" id="pic"></div></body></html>
