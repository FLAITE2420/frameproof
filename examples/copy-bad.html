<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>frameproof copy</title>
<style>
  html,body{margin:0;background:#f7f7f8;color:#111;font:16px/1.4 ui-sans-serif,system-ui,sans-serif}
  .stage{height:100vh;display:grid;place-items:center;gap:0}
  .cards{display:flex;gap:24px}
  .card{width:220px;height:260px;border-radius:16px;background:#fff;box-shadow:0 1px 2px #0002,0 12px 32px #0001;
        opacity:0;transform:translateY(24px);
        animation:rise 900ms ease-out forwards}
  .card:nth-child(1){animation-delay:0ms}
  .card:nth-child(2){animation-delay:60ms}
  .card:nth-child(3){animation-delay:120ms}
  .title{position:absolute;top:64px;left:50%;translate:-50% 0;font-size:34px;font-weight:650;letter-spacing:-.02em;
         opacity:0;animation:fade 300ms linear 200ms forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes fade{to{opacity:1}}
</style></head>
<body>
  <div class="stage">
    <h1 class="title" id="title">copy</h1>
    <div class="cards">
      <div class="card" id="c1"></div>
      <div class="card" id="c2"></div>
      <div class="card" id="c3"></div>
    </div>
  </div>
</body></html>
