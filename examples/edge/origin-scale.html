<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>edge: transform-origin scale</title>
<style>
  html,body{margin:0;background:#0b0b0c;color:#fff;font:16px ui-sans-serif,system-ui}
  .menu{position:absolute;left:80px;top:120px;width:240px;height:200px;border-radius:14px;background:#27272a;
        transform-origin:bottom right;animation:pop 500ms cubic-bezier(.34,1.56,.64,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
</style></head><body><div class="menu" id="menu"></div></body></html>
